<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mwfaq FAQ Assistant</title>
<style>
  /* ---- Design tokens: light ---------------------------------------- */
  :root {
    color-scheme: light;
    --bg:          #f6f7f9;
    --surface:     #ffffff;
    --surface-2:   #f0f2f5;
    --border:      #e2e5ea;
    --border-2:    #d4d9e0;
    --text:        #1a1d21;
    --text-dim:    #5c6470;
    --text-faint:  #8b93a1;
    --accent:      #0f766e;
    --accent-soft: #d7f0ec;
    --accent-text: #ffffff;
    --warn:        #b45309;
    --warn-soft:   #fef3e2;
    --warn-border: #f5d9ac;
    --danger:      #b42318;
    --danger-soft: #fee4e2;
    --user-bubble: #0f766e;
    --user-text:   #ffffff;
    --shadow:      0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
    --shadow-lg:   0 4px 6px -1px rgba(16,24,40,.08), 0 12px 20px -4px rgba(16,24,40,.12);
    --radius:      12px;
  }
  /* ---- Design tokens: dark ----------------------------------------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:          #14171c;
      --surface:     #1b1f26;
      --surface-2:   #232830;
      --border:      #2c323c;
      --border-2:    #3a414d;
      --text:        #e8eaed;
      --text-dim:    #a2aab8;
      --text-faint:  #757e8c;
      --accent:      #2dd4bf;
      --accent-soft: #123b38;
      --accent-text: #08201e;
      --warn:        #fbbf24;
      --warn-soft:   #3a2e12;
      --warn-border: #5c4818;
      --danger:      #fda29b;
      --danger-soft: #45211e;
      --user-bubble: #14b8a6;
      --user-text:   #08201e;
      --shadow:      0 1px 2px rgba(0,0,0,.30);
      --shadow-lg:   0 8px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:          #14171c;
    --surface:     #1b1f26;
    --surface-2:   #232830;
    --border:      #2c323c;
    --border-2:    #3a414d;
    --text:        #e8eaed;
    --text-dim:    #a2aab8;
    --text-faint:  #757e8c;
    --accent:      #2dd4bf;
    --accent-soft: #123b38;
    --accent-text: #08201e;
    --warn:        #fbbf24;
    --warn-soft:   #3a2e12;
    --warn-border: #5c4818;
    --danger:      #fda29b;
    --danger-soft: #45211e;
    --user-bubble: #14b8a6;
    --user-text:   #08201e;
    --shadow:      0 1px 2px rgba(0,0,0,.30);
    --shadow-lg:   0 8px 24px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Arabic",
          "Segoe UI Historic", Tahoma, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }

  /* ---- Header ------------------------------------------------------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-inline-end: auto; min-width: 0; }
  .logo {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
  }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .brand p  { margin: 0; font-size: 12px; color: var(--text-faint); }

  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .dot.ok   { background: #12b76a; }
  .dot.bad  { background: #f04438; }

  .icon-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 8px;
    width: 34px; height: 34px; display: grid; place-items: center;
    transition: background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-2); }
  .icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8;
                  stroke-linecap: round; stroke-linejoin: round; }

  .live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
    color: #b42318; background: var(--danger-soft);
    padding: 3px 9px; border-radius: 999px;
  }
  :root[data-theme="dark"] .live { color: #fda29b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .live { color: #fda29b; }
  }
  .pulse {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  /* An externally pushed message is visibly distinct from one typed here. */
  .msg.inbound .bubble {
    background: var(--surface); color: var(--text);
    border: 1px dashed var(--accent);
  }
  .inbound-tag {
    font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
    color: var(--accent); margin-bottom: 5px; text-align: end;
  }

  /* ---- Settings panel ----------------------------------------------- */
  #settings {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 22px; align-items: center;
    font-size: 13px; color: var(--text-dim);
  }
  #settings label { display: flex; align-items: center; gap: 8px; }
  #settings input[type=range] { width: 110px; accent-color: var(--accent); }
  #settings input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  #settings .val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 12px; }
  .sep { width: 1px; height: 20px; background: var(--border); }

  /* ---- Messages ------------------------------------------------------ */
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .thread { max-width: 820px; margin: 0 auto; padding: 24px 20px 8px; }

  .msg { margin-bottom: 22px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 88%; padding: 11px 15px; border-radius: var(--radius);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.user .bubble {
    background: var(--user-bubble); color: var(--user-text);
    border-end-end-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-end-start-radius: 4px; box-shadow: var(--shadow);
  }
  /* A low-confidence reply must never look like a confident one. */
  .msg.bot.unsure .bubble { background: var(--warn-soft); border-color: var(--warn-border); }
  .msg.bot.error  .bubble { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

  .unsure-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--warn);
    margin-bottom: 8px;
  }
  .unsure-tag svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
                    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- Answer metadata ----------------------------------------------- */
  .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin-top: 9px; font-size: 12px; color: var(--text-faint);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 11.5px; white-space: nowrap;
  }
  .chip.cite {
    background: var(--accent-soft); border-color: transparent;
    color: var(--accent); font-weight: 600; cursor: pointer;
    transition: filter .15s;
  }
  .chip.cite:hover { filter: brightness(.94); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .chip.cite:hover { filter: brightness(1.25); }
  }
  :root[data-theme="dark"] .chip.cite:hover { filter: brightness(1.25); }
  .conf-bar {
    width: 42px; height: 4px; border-radius: 2px; background: var(--border-2);
    overflow: hidden; display: inline-block; vertical-align: middle;
  }
  .conf-bar i { display: block; height: 100%; background: var(--accent); }
  .msg.unsure .conf-bar i { background: var(--warn); }

  /* ---- Sources / debug disclosure ------------------------------------- */
  details.sources { margin-top: 10px; }
  details.sources > summary {
    cursor: pointer; font-size: 12px; color: var(--text-dim);
    list-style: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 0; user-select: none;
  }
  details.sources > summary::-webkit-details-marker { display: none; }
  details.sources > summary::before {
    content: "▸"; font-size: 10px; transition: transform .15s; display: inline-block;
  }
  details.sources[open] > summary::before { transform: rotate(90deg); }
  details.sources > summary:hover { color: var(--text); }

  .src {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 13px; margin-top: 8px; background: var(--surface-2);
  }
  .src.dim { opacity: .62; }
  .src-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
    margin-bottom: 6px; font-size: 11.5px; color: var(--text-faint);
  }
  .src-id {
    font-weight: 700; color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .src-q { font-weight: 600; margin-bottom: 4px; font-size: 13.5px; }
  .src-a { font-size: 13px; color: var(--text-dim); }
  .src mark { background: var(--accent-soft); color: inherit; padding: 0 2px; border-radius: 3px; }

  table.scores { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
  table.scores th, table.scores td {
    text-align: start; padding: 5px 8px; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  table.scores th { color: var(--text-faint); font-weight: 600; }
  .scroll-x { overflow-x: auto; }

  /* ---- Welcome / suggestions ------------------------------------------ */
  .welcome { text-align: center; padding: 44px 20px 20px; }
  .welcome h2 { margin: 0 0 6px; font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
  .welcome p  { margin: 0 0 22px; color: var(--text-dim); font-size: 14px; }
  .suggestions { display: grid; gap: 9px; grid-template-columns: repeat(auto-fit, minmax(228px, 1fr)); }
  .suggest {
    text-align: start; padding: 12px 14px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-size: 13.5px; transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  .suggest:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
  .suggest small { display: block; color: var(--text-faint); font-size: 11px; margin-top: 3px; }

  /* ---- Thinking indicator ---------------------------------------------- */
  .thinking { display: flex; align-items: center; gap: 9px; color: var(--text-dim); font-size: 13px; }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--border-2); border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
    main { scroll-behavior: auto; }
  }

  /* ---- Composer --------------------------------------------------------- */
  footer {
    flex-shrink: 0; background: var(--surface);
    border-top: 1px solid var(--border); padding: 12px 20px 14px;
  }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 9px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; padding: 11px 14px; max-height: 168px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border-2); border-radius: var(--radius);
    font: inherit; line-height: 1.5;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #input::placeholder { color: var(--text-faint); }
  #send {
    background: var(--accent); color: var(--accent-text); border: 0;
    border-radius: var(--radius); width: 42px; height: 42px;
    display: grid; place-items: center; flex-shrink: 0; transition: opacity .15s;
  }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  #send svg { width: 18px; height: 18px; fill: none; stroke: currentColor;
              stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hint { max-width: 820px; margin: 7px auto 0; font-size: 11px; color: var(--text-faint); text-align: center; }

  @media (max-width: 640px) {
    .bubble { max-width: 96%; }
    #settings { gap: 14px; padding: 12px 16px; }
    .thread { padding: 18px 14px 8px; }
    header { padding: 10px 14px; }
    .brand p { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">م</div>
    <div>
      <h1>Mwfaq FAQ Assistant</h1>
      <p>Grounded answers from the FAQ knowledge base &middot; العربية / English</p>
    </div>
  </div>

  <div class="status" id="status" title="Backend status">
    <span class="dot" id="statusDot"></span><span id="statusText">connecting…</span>
  </div>

  <div class="live" id="liveBadge" hidden title="Live stream connected">
    <span class="pulse"></span>LIVE
  </div>

  <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings" aria-expanded="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <button class="icon-btn" id="clearBtn" title="Clear conversation" aria-label="Clear conversation">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/></svg>
  </button>
</header>

<div id="settings" hidden>
  <label>Top-K <input type="range" id="topK" min="1" max="10" value="5"><span class="val" id="topKVal">5</span></label>
  <div class="sep"></div>
  <label><input type="checkbox" id="showRetrieved"> Show all retrieved chunks</label>
  <label><input type="checkbox" id="showScores"> Show retrieval scores</label>
</div>

<main id="main">
  <div class="thread" id="thread">
    <div class="welcome" id="welcome">
      <h2>Ask about Mwfaq</h2>
      <p>Answers come only from the FAQ knowledge base, with citations. Ask in Arabic or English.</p>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask a question…  /  اسأل سؤالاً…" autofocus></textarea>
    <button id="send" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <div class="hint">Enter to send &middot; Shift+Enter for a new line</div>
</footer>

<script>
"use strict";

/* The page talks to the same origin that served it, so no base URL or CORS
   configuration is needed. */
const API = "";

const els = {
  thread:   document.getElementById("thread"),
  welcome:  document.getElementById("welcome"),
  main:     document.getElementById("main"),
  input:    document.getElementById("input"),
  send:     document.getElementById("send"),
  statusDot:  document.getElementById("statusDot"),
  statusText: document.getElementById("statusText"),
  settings: document.getElementById("settings"),
  topK:     document.getElementById("topK"),
  topKVal:  document.getElementById("topKVal"),
  showRetrieved: document.getElementById("showRetrieved"),
  showScores:    document.getElementById("showScores"),
  suggestions:   document.getElementById("suggestions"),
};

let busy = false;

/* ---- Preferences (best-effort; storage can throw in private mode) ------ */
const prefs = {
  read(key, fallback) {
    try { const v = localStorage.getItem("faqrag." + key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  write(key, value) {
    try { localStorage.setItem("faqrag." + key, JSON.stringify(value)); } catch { /* ignore */ }
  },
};

/* ---- Utilities --------------------------------------------------------- */
const ARABIC = /[؀-ۿݐ-ݿࢠ-ࣿ]/;

/** Direction for a string, so Arabic renders RTL inside an LTR page. */
function dirOf(text) { return ARABIC.test(text || "") ? "rtl" : "ltr"; }

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;   // textContent: never innerHTML
  return node;
}

function scrollToEnd() { els.main.scrollTop = els.main.scrollHeight; }

/* ---- Suggested questions ----------------------------------------------- */
const SUGGESTIONS = [
  { q: "What is Mwfaq Business?",              hint: "English · company services" },
  { q: "ما هي أكاديمية موفق؟",                  hint: "العربية · التدريب" },
  { q: "What payment methods are accepted?",   hint: "English · payments" },
  { q: "كيف أحجز فحصي الطبي عبر موفق؟",         hint: "العربية · الحجز" },
];

for (const item of SUGGESTIONS) {
  const button = el("button", "suggest");
  const label = el("span", null, item.q);
  label.dir = dirOf(item.q);
  button.append(label, el("small", null, item.hint));
  button.addEventListener("click", () => { els.input.value = item.q; submit(); });
  els.suggestions.append(button);
}

/* ---- Health ------------------------------------------------------------ */
async function checkHealth() {
  try {
    const response = await fetch(API + "/health");
    const data = await response.json();
    if (data.status === "ok") {
      els.statusDot.className = "dot ok";
      els.statusText.textContent = `${data.indexed_chunks} chunks · ${data.llm_model}`;
      els.statusText.parentElement.title =
        `embeddings: ${data.embedding_model}\nstore: ${data.vector_store}\nrerank: ${data.rerank_enabled}`;
    } else {
      els.statusDot.className = "dot bad";
      els.statusText.textContent = "index not loaded";
      els.statusText.parentElement.title = data.detail || "";
    }
  } catch {
    els.statusDot.className = "dot bad";
    els.statusText.textContent = "backend offline";
  }
}

/* ---- Rendering --------------------------------------------------------- */
function addUserMessage(text) {
  els.welcome?.remove();
  const wrap = el("div", "msg user");
  const bubble = el("div", "bubble", text);
  bubble.dir = dirOf(text);
  wrap.append(bubble);
  els.thread.append(wrap);
  scrollToEnd();
}

/** Placeholder shown while the request is in flight, with an elapsed timer. */
function addThinking() {
  const wrap = el("div", "msg bot");
  const bubble = el("div", "bubble");
  const row = el("div", "thinking");
  const timer = el("span", null, "Searching the FAQ…");
  row.append(el("div", "spinner"), timer);
  bubble.append(row);
  wrap.append(bubble);
  els.thread.append(wrap);
  scrollToEnd();

  // Reranking makes a query take ~10s; a visible clock stops that reading as a hang.
  const startedAt = Date.now();
  const tick = setInterval(() => {
    const seconds = Math.round((Date.now() - startedAt) / 1000);
    timer.textContent = seconds < 3 ? "Searching the FAQ…" : `Thinking… ${seconds}s`;
  }, 500);

  return { wrap, stop: () => clearInterval(tick) };
}

function sourceCard(source, dim) {
  const card = el("div", "src" + (dim ? " dim" : ""));
  const head = el("div", "src-head");
  head.append(el("span", "src-id", "FAQ " + source.faq_id));
  head.append(el("span", null, source.category));
  head.append(el("span", null, source.lang.toUpperCase()));
  if (typeof source.score === "number") head.append(el("span", null, source.score.toFixed(3)));

  const question = el("div", "src-q", source.question);
  const answer = el("div", "src-a", source.answer);
  question.dir = answer.dir = dirOf(source.question);

  card.append(head, question, answer);
  return card;
}

function scoreTable(chunks) {
  const wrap = el("div", "scroll-x");
  const table = el("table", "scores");
  const head = table.insertRow();
  for (const label of ["FAQ", "lang", "rank", "relevance", "vector", "BM25", "rerank"]) {
    const th = document.createElement("th");
    th.textContent = label;
    head.append(th);
  }
  const fmt = (v, digits) => (typeof v === "number" ? v.toFixed(digits) : "—");
  for (const chunk of chunks) {
    const row = table.insertRow();
    for (const value of [
      chunk.faq_id, chunk.lang,
      fmt(chunk.rank_score, 3), fmt(chunk.relevance, 3),
      fmt(chunk.vector_score, 3), fmt(chunk.lexical_score, 2), fmt(chunk.rerank_score, 1),
    ]) row.insertCell().textContent = value;
  }
  wrap.append(table);
  return wrap;
}

function addAnswer(data) {
  const confident = data.confident && data.cited_faq_ids.length > 0;
  const wrap = el("div", "msg bot" + (confident ? "" : " unsure"));
  const bubble = el("div", "bubble");

  // The API's `confident` flag drives a visible treatment, so an "I don't know"
  // can never be mistaken for a sourced answer.
  if (!confident) {
    const tag = el("div", "unsure-tag");
    tag.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
    tag.append(document.createTextNode("No confident match — not answered from the FAQ"));
    bubble.append(tag);
  }

  const text = el("div", null, data.answer);
  text.dir = dirOf(data.answer);
  bubble.append(text);

  /* --- metadata row --- */
  const meta = el("div", "meta");
  const pct = Math.round((data.confidence || 0) * 100);
  const conf = el("span", "chip");
  const bar = el("span", "conf-bar");
  const fill = document.createElement("i");
  fill.style.width = Math.max(2, Math.min(100, pct)) + "%";
  bar.append(fill);
  conf.append(bar, document.createTextNode(pct + "%"));
  conf.title = "Confidence (absolute relevance of the best chunk)";
  meta.append(conf);

  meta.append(el("span", "chip", data.language === "ar" ? "العربية" : "English"));
  if (data.reranked) meta.append(el("span", "chip", "reranked"));
  if (data.cross_lingual_fallback) meta.append(el("span", "chip", "cross-lingual"));
  if (typeof data.latency_ms === "number") {
    meta.append(el("span", "chip", (data.latency_ms / 1000).toFixed(1) + "s"));
  }

  for (const faqId of data.cited_faq_ids) {
    const chip = el("span", "chip cite", "FAQ " + faqId);
    chip.title = "Show this source";
    chip.addEventListener("click", () => {
      const details = wrap.querySelector("details.sources");
      if (details) { details.open = true; details.scrollIntoView({ block: "nearest" }); }
    });
    meta.append(chip);
  }
  bubble.append(meta);

  /* --- cited sources --- */
  if (data.sources?.length) {
    const details = el("details", "sources");
    const summary = document.createElement("summary");
    summary.textContent = `${data.sources.length} cited source${data.sources.length > 1 ? "s" : ""}`;
    details.append(summary);
    for (const source of data.sources) details.append(sourceCard(source, false));
    bubble.append(details);
  }

  /* --- everything retrieved (opt-in) --- */
  const cited = new Set(data.cited_faq_ids);
  if (els.showRetrieved.checked && data.retrieved?.length) {
    const details = el("details", "sources");
    const summary = document.createElement("summary");
    summary.textContent = `${data.retrieved.length} retrieved chunks (dimmed = not cited)`;
    details.append(summary);
    for (const source of data.retrieved) {
      details.append(sourceCard(source, !cited.has(source.faq_id)));
    }
    bubble.append(details);
  }

  wrap.append(bubble);
  els.thread.append(wrap);
  scrollToEnd();
  return wrap;
}

function addError(message) {
  els.welcome?.remove();
  const wrap = el("div", "msg bot error");
  wrap.append(el("div", "bubble", message));
  els.thread.append(wrap);
  scrollToEnd();
}

/**
 * Fetch the raw retrieval scores and append them to an answer.
 *
 * Deliberately not awaited by the caller: this is a second round-trip that
 * re-runs the reranker (~6s), and the answer is already usable without it.
 * Blocking on it would freeze the composer long after the reply was readable.
 */
async function appendScores(wrap, question) {
  const details = el("details", "sources");
  const summary = document.createElement("summary");
  summary.textContent = "retrieval scores — loading…";
  details.append(summary);
  wrap.querySelector(".bubble").append(details);

  try {
    const response = await fetch(API + "/retrieve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, top_k: Number(els.topK.value) }),
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    summary.textContent = "retrieval scores";
    details.append(scoreTable(data.chunks));
  } catch {
    // Scores are a debugging aid; say so quietly rather than failing the answer.
    summary.textContent = "retrieval scores — unavailable";
  }
}

/* ---- Submit ------------------------------------------------------------ */
async function submit() {
  const question = els.input.value.trim();
  if (!question || busy) return;

  busy = true;
  els.send.disabled = true;
  els.input.value = "";
  els.input.style.height = "auto";
  addUserMessage(question);

  const thinking = addThinking();
  try {
    const response = await fetch(API + "/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, top_k: Number(els.topK.value) }),
    });
    thinking.stop();
    thinking.wrap.remove();

    if (!response.ok) {
      let detail = `HTTP ${response.status}`;
      try { detail = (await response.json()).detail || detail; } catch { /* keep status */ }
      addError(response.status === 503
        ? `Backend not ready: ${detail}\n\nRun:  python -m faqrag.index`
        : `Request failed: ${detail}`);
    } else {
      const data = await response.json();
      const wrap = addAnswer(data);
      // Fire-and-forget so the composer unlocks as soon as the answer lands.
      if (els.showScores.checked) void appendScores(wrap, question);
    }
  } catch (error) {
    thinking.stop();
    thinking.wrap.remove();
    addError("Could not reach the backend. Is it running?\n\nRun:  python -m faqrag.api");
  } finally {
    busy = false;
    els.send.disabled = false;
    els.input.focus();
    scrollToEnd();
  }
}

/* ---- Live inbound stream (Server-Sent Events) --------------------------
   Messages pushed to POST /v1/messages by another system appear here the
   moment they land, rather than on some poll interval. Questions sent from
   this page are not echoed here: the composer posts to /query, which does not
   broadcast, so only genuinely external traffic appears on this stream. */
let liveStream = null;

function markLive(on, detail) {
  const badge = document.getElementById("liveBadge");
  badge.hidden = !on;
  if (detail) badge.title = detail;
}

function renderInbound(data) {
  if (seenMessages.has(data.message_id)) return;   // already drawn
  seenMessages.add(data.message_id);
  els.welcome?.remove();
  const wrap = el("div", "msg user inbound");
  wrap.dataset.messageId = data.message_id;

  const tag = el("div", "inbound-tag", "وصلت رسالة  ·  incoming");
  const bubble = el("div", "bubble", data.text);
  bubble.dir = dirOf(data.text);
  wrap.append(tag, bubble);
  els.thread.append(wrap);

  // Placeholder so the operator can see it is being worked on.
  const pending = addThinking();
  pending.wrap.dataset.pendingFor = data.message_id;
  scrollToEnd();
}

function renderInboundAnswer(data) {
  if (answeredMessages.has(data.message_id)) return;
  answeredMessages.add(data.message_id);

  const pending = els.thread.querySelector(`[data-pending-for="${data.message_id}"]`);
  if (pending) pending.remove();

  // The SSE payload mirrors QueryResponse closely enough to reuse the renderer.
  addAnswer({
    answer: data.answer || "",
    cited_faq_ids: data.cited_faq_ids || [],
    sources: data.sources || [],
    retrieved: [],
    confident: data.confident,
    confidence: data.confidence || 0,
    language: data.language || "ar",
    reranked: false,
    cross_lingual_fallback: false,
    latency_ms: data.latency_ms,
  });
}

const HANDLERS = {
  "stream.open": () => markLive(true, "live connection open"),
  "message.received": (data) => renderInbound(data),
  "message.answered": (data) => renderInboundAnswer(data),
  "message.failed": (data) => {
    const pending = els.thread.querySelector(`[data-pending-for="${data.message_id}"]`);
    if (pending) pending.remove();
    addError(`Failed to answer an incoming message: ${data.error}`);
  },
  ping: () => {},
};

let reconnectDelay = 1000;
// Ids already drawn, so a backfill and the live feed cannot double-render the
// same message. Tracked separately for the question and the answer because they
// arrive as two events roughly ten seconds apart.
const seenMessages = new Set();
const answeredMessages = new Set();

/**
 * Open the live channel over a WebSocket.
 *
 * A WebSocket rather than the /v1/events SSE stream, because SSE does not
 * survive every proxy: a Cloudflare quick tunnel buffers the response
 * indefinitely, so the server emits events correctly and the browser receives
 * nothing at all. A WebSocket is negotiated as a connection upgrade instead of
 * a long response body, so it works both locally and through a tunnel.
 */
function connectLiveStream() {
  if (liveStream) {
    liveStream.onclose = null;          // don't let the old socket schedule a retry
    liveStream.close();
  }

  const url = new URL("/v1/ws", location.href);
  url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  liveStream = new WebSocket(url);

  liveStream.onopen = () => {
    reconnectDelay = 1000;
    // The socket does not replay what it missed while disconnected, so pull
    // recent messages once on every (re)connect. renderInbound de-duplicates,
    // so this is safe to run on the first connect too.
    backfill();
  };

  liveStream.onmessage = (event) => {
    let payload;
    try { payload = JSON.parse(event.data); } catch { return; }
    (HANDLERS[payload.event] || (() => {}))(payload.data || {});
  };

  // Unlike EventSource, a WebSocket does not reconnect itself. Back off
  // exponentially so a server restart does not turn into a reconnect storm.
  liveStream.onclose = () => {
    markLive(false, "reconnecting…");
    setTimeout(connectLiveStream, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  };

  liveStream.onerror = () => markLive(false, "connection error");
}

/**
 * Pull recent messages so a reconnect does not leave a gap in the transcript.
 * Failures are ignored: the live socket is the primary channel, and a failed
 * backfill must not break it.
 */
async function backfill() {
  try {
    const recent = await fetch(API + "/v1/history?limit=20").then(r => r.json());
    for (const message of recent) {
      renderInbound(message);
      if (message.status === "done") renderInboundAnswer(message);
    }
  } catch { /* live feed continues regardless */ }
}

/* ---- Events ------------------------------------------------------------ */
els.send.addEventListener("click", submit);

els.input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); submit(); }
});

els.input.addEventListener("input", () => {
  els.input.dir = dirOf(els.input.value);          // flip to RTL as Arabic is typed
  els.input.style.height = "auto";
  els.input.style.height = Math.min(els.input.scrollHeight, 168) + "px";
});

document.getElementById("settingsBtn").addEventListener("click", (event) => {
  const hidden = els.settings.hidden;
  els.settings.hidden = !hidden;
  event.currentTarget.setAttribute("aria-expanded", String(hidden));
});

document.getElementById("clearBtn").addEventListener("click", () => {
  els.thread.replaceChildren(els.welcome);
  els.welcome.hidden = false;
});

const themeBtn = document.getElementById("themeBtn");
themeBtn.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const next = current ? (current === "dark" ? "light" : "dark") : (dark ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  prefs.write("theme", next);
});

els.topK.addEventListener("input", () => {
  els.topKVal.textContent = els.topK.value;
  prefs.write("topK", els.topK.value);
});
for (const box of [els.showRetrieved, els.showScores]) {
  box.addEventListener("change", () => prefs.write(box.id, box.checked));
}

/* ---- Restore preferences and start ------------------------------------- */
const savedTheme = prefs.read("theme", null);
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
els.topK.value = prefs.read("topK", "5");
els.topKVal.textContent = els.topK.value;
els.showRetrieved.checked = prefs.read("showRetrieved", false);
els.showScores.checked = prefs.read("showScores", false);

checkHealth();
setInterval(checkHealth, 30000);
connectLiveStream();
</script>
</body>
</html>
